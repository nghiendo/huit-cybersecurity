services:
  backend:
    build:
      context: ./backend
    container_name: huit-cybersecurity-backend
    env_file:
      - ./.env
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/data
        : > /app/data/backend-terminal.log
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app 2>&1 | tee -a /app/data/backend-terminal.log
    environment:
      LAB_MODE: vulnerable
      BLOCK_THRESHOLD: "0.85"
      DATABASE_PATH: /app/data/lab.sqlite
      BACKEND_TERMINAL_LOG_PATH: /app/data/backend-terminal.log
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: huit-cybersecurity-frontend
    environment:
      VITE_HOST: 0.0.0.0
      VITE_PORT: "5173"
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
